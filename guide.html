html{scroll-behavior:smooth}

nav{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1080px;margin:0 auto}

.cta{max-width:540px;margin:8px auto 0;padding:8px 24px 24px;text-align:center}
.cta h2{font-family:'Playfair Display',serif;font-weight:600;font-size:30px;line-height:1.2;color:var(--sand)}
.cta h2 span{color:var(--accent)}
.cta p{font-size:13px;font-weight:300;color:var(--stone);margin-top:14px}
footer{text-align:center;padding:40px 20px 48px;font-size:12px;color:var(--sand-dark);line-height:1.8}
footer a{color:var(--sand-dark)}
